name: CI

on:
  push:
    branches: ["**"]       # all branches
    tags-ignore: ["**"]    # ignore tags here; releases handled in release.yml
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pipx install uv==0.12.23

      - name: Cache uv and venv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ./.venv
          key: uv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Sync dependencies (frozen)
        run: uv sync --all-extras --frozen

      - name: Run pre-commit (all files)
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files

      - name: Run tests
        run: uv run pytest -v --cov-report=xml

      # Only one version needs to feed the badge; 3.12 is the version the docs
      # and the recommended install line use.
      - name: Upload the coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  # The coverage badge is a JSON file on the `badges` branch, read by
  # shields.io. Keeping it in this repository avoids depending on a third-party
  # coverage service, and needs no secret beyond the built-in GITHUB_TOKEN.
  coverage-badge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_owner == 'DomynAI'
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: coverage-xml

      - name: Render the badge payload
        run: python3 .github/scripts/coverage_badge.py coverage.xml -o badge.json && cat badge.json

      # A dedicated orphan branch: it shares no history with main, so the badge
      # commits never appear in the source history and cannot collide with it.
      - name: Publish it to the badges branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          cp badge.json "$work/coverage.json"
          cd "$work"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # A mixed reset seeds the index from the existing branch, so anything
          # else already published there survives a commit that only stages
          # coverage.json.
          if git fetch -q --depth 1 origin badges 2>/dev/null; then
            git reset -q FETCH_HEAD
          fi
          git add coverage.json
          # Nothing to do when the percentage has not moved.
          if git diff --cached --quiet; then
            echo "coverage unchanged; leaving the badges branch alone"
            exit 0
          fi
          pct=$(python3 -c 'import json;print(json.load(open("coverage.json"))["message"])')
          git commit -qm "coverage: ${pct} at ${GITHUB_SHA:0:7}"
          git push -q origin HEAD:badges

  build-dev-image:
    # Build/push dev images only for branch pushes from the main repo (not PRs from forks)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.repository_owner == 'DomynAI'
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Compute tags (≤128 chars)
        id: vars
        shell: bash
        run: |
          BRANCH="${GITHUB_REF_NAME}"

          # slugify: lowercase + replace invalid chars with '-'
          SLUG="$(
            printf '%s' "$BRANCH" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9._-]+/-/g'
          )"

          # Truncate safely and remove trailing separators after truncation
          SLUG_124="$(printf '%s' "$SLUG" | cut -c1-124 | sed -E 's/[-._]+$//')"
          SLUG_111="$(printf '%s' "$SLUG" | cut -c1-111 | sed -E 's/[-._]+$//')"

          SHORT_SHA="$(git rev-parse --short=12 HEAD)"

          echo "BRANCH_TAG=dev-${SLUG_124}" >> "$GITHUB_OUTPUT"
          echo "SHA_TAG=dev-${SLUG_111}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          # (optional) debug
          echo "BRANCH_TAG length: $(( ${#SLUG_124} + 4 ))"
          echo "SHA_TAG length: $(( ${#SLUG_111} + 4 + 1 + 12 ))"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            igeniusai/domyn-swarm
          tags: |
            type=raw,value=${{ steps.vars.outputs.BRANCH_TAG }}
            type=raw,value=${{ steps.vars.outputs.SHA_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push (dev)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

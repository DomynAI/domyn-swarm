[project]
name = "domyn-swarm"
version = "0.34.0"
description = "CLI and programmatic API to launch LLM inference endpoints on Slurm, using simple configuration files"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "Apache-2.0" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",

    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",

    "Operating System :: POSIX :: Linux",
    "Environment :: Console",

    "Typing :: Typed",

    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
    "Framework :: AsyncIO",
    "Natural Language :: English",
]

authors = [
    { name = "Federico D'Ambrosio", email = "federico.dambrosio@domyn.com" },
]
maintainers = [
    { name = "Federico D'Ambrosio", email = "federico.dambrosio@domyn.com" },
    { name = "Alessandro Rognoni", email = "alessandro.rognoni@domyn.com" },
]
dependencies = [
    "blake3>=1.0.5",
    "fsspec>=2025.3.0",
    "huggingface-hub>=1.16.0",
    "jinja2>=3.1.6",
    "openai>=1.88.0",
    "pandas>=1.5.3",
    "pyarrow>=22.0.0",
    "pydantic>=2.11.7,<3",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.2",
    "requests>=2.34.2",
    "rich>=14.0.0,<15",
    "tenacity>=9.0.0,<10",
    "typer>=0.16.0",
    "deprecated>=1.2.18",
    "python-ulid[pydantic]>=3.1.0",
    "sqlalchemy>=2.0.44",
    "alembic>=1.17.1",
]

[dependency-groups]
dev = [
    "commitizen>=4.8.3",
    "pre-commit>=4.3.0",
    "pyright>=1.1.404",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "pytest-check>=2.5.3",
    "pytest-cov>=6.2.1",
    "pytest-icdiff>=0.9",
    "pytest-mock>=3.14.1",
    "pytest-sugar>=1.0.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.11.13",
]
linting = ["pre-commit", "ruff>=0.11.13"]
docs = [
    "sphinx>=8.2,<10",
    "myst-parser>=5.1",
    "pydata-sphinx-theme>=0.20",
    "sphinx-design>=0.7",
    "sphinx-copybutton>=0.5",
    "sphinx-click>=6.2",
]
bench = [
    "datasets>=4.8.5",
    "vllm>=0.26.0",
]

[project.urls]
Homepage = "https://www.domyn.com/"
Repository = "https://github.com/DomynAI/domyn-swarm"
Issues = "https://github.com/DomynAI/domyn-swarm/issues"
Changelog = "https://github.com/DomynAI/domyn-swarm/blob/main/CHANGELOG.md"


[project.scripts]
domyn-swarm = "domyn_swarm.cli:app"
ds = "domyn_swarm.cli:app"
dswarm = "domyn_swarm.cli:app"

[project.entry-points."uv.run"]
domyn-swarm = "domyn_swarm.cli:app"
ds = "domyn_swarm.cli:app"
dswarm = "domyn_swarm.cli:app"

[project.optional-dependencies]
lepton = [
    "leptonai>=0.27.2; python_version < '3.14'",
]
polars = [
    "polars>=1.31.0",
]
ray = [
    "ray[data]>=2.55.0",
]
all = [
    "leptonai>=0.27.2; python_version < '3.14'",
    "polars>=1.31.0",
    "ray[data]>=2.53.0",
]

[tool.uv]
# leptonai's prometheus-fastapi-instrumentator==7.0.0 pin drags in
# starlette <1.0, which carries five open advisories (GHSA request.form
# limits, StaticFiles UNC SSRF, Host header poisoning, HTTPEndpoint method
# dispatch). We only ever use leptonai as an API client
# (leptonai.api.v1/v2), never its photon server, so the pin buys us nothing
# and the override lifts starlette to a patched release.
#
# leptonai also caps anyio at <=4.9.0, which blocks the fixes for the TLSStream
# IDNA hostname spoofing and process-pool stderr deadlock advisories. The API
# client imports leptonai.util, which only uses stable anyio 4 APIs.
#
# vllm caps setuptools at <81, which blocks the fix for the legacy wheel
# namespace_packages.txt path escape advisory. vllm and torch are the only
# packages that pull setuptools, and both come in through the bench group.
override-dependencies = [
    "anyio>=4.14.2,<5",
    "prometheus-fastapi-instrumentator>=8.0.0",
    "setuptools>=84.1.0",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "uv"
update_changelog_on_bump = true
version_files = [
    "README.md:domyn-swarm\\.git@v",
    "docs/getting-started/installation.md:RELEASE=v",
]
major_version_zero = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/domyn_swarm"]

[tool.hatch.build.targets.sdist]
include = [
  "src/domyn_swarm",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]
include = ["pyproject.toml", "src/**/*.py", "docs/**/*.py", "tests/**/*.py"]
respect-gitignore = true
extend-exclude = [
  ".venv", "venv", "build", "dist", "**/__pycache__",
  "migrations", "docs/_build", "examples"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint]
# Pragmatic baseline:
# - E,F,W: pycodestyle/pyflakes (core correctness)
# - I: import sorting
# - B: bugbear (real bugs & footguns)
# - UP: safe pyupgrade for py311
# - SIM: gentle simplifications
# - PERF: low-risk performance lint
# - C90: mccabe complexity (C901)
# - RUF: a few Ruff-specific niceties (e.g., unused noqa)
# - T20: warn on stray prints (we’ll allow them in tests/scripts below)
# - LOG: better logging practices (format args, etc.)
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PERF", "C90", "RUF", "T20", "LOG"]

# Trim a few rules that are helpful but often noisy/heavy-handed.
ignore = [
  # zip(strict=…) is great, but this is often too pushy for general codebases.
  "B905",
  "B008",
  # StrEnum changes str() of members, which feeds CLI output and persisted state.
  "UP042",
]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.lint.mccabe]
# Moderate threshold: flags only the truly gnarly functions.
max-complexity = 14

[tool.ruff.lint.per-file-ignores]
# Allow prints in exploratory or CLI-like code and in tests.
"tests/**/*.py" = ["T201"]
# conf.py and the deploy script report progress on stdout, which is the point.
"docs/**/*.py" = ["T201"]
"src/domyn_swarm/helpers/*.py" = ["T201"]
"src/domyn_swarm/runtime/*.py" = ["T201"]
"src/domyn_swarm/utils/version.py" = ["T201"]
"src/domyn_swarm/cli/main.py" = ["T201"]

[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__"]
ignore = ["tests", "examples", "docs"]
defineConstant = { DEBUG = true }

reportMissingImports = "error"
reportMissingTypeStubs = false

pythonPlatform = "Linux"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = "--cov-config=.coveragerc --cov=src/ --cov-report html"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "timeout: per-test timeout marker (requires pytest-timeout to enforce)",
]
